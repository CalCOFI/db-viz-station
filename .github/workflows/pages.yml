name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: head of the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Deploy an EXPLICIT commit when one is given, not whatever `main` resolves
      # to now. refresh.yml pushes and then immediately dispatches this workflow,
      # and GitHub's resolution of `--ref main` is not guaranteed to have caught
      # up with that push. Observed in the sibling CalCOFI/ctd-transects, which
      # runs this same pair: a refresh pushed 2dccd93 and the pages run it
      # dispatched 81s later checked out that job's own PRE-push SHA, uploaded
      # the stale tree, and reported success. The site got a fresh Last-Modified
      # wrapping old bytes and nothing went red.
      #
      # It is a race, not a deterministic failure, which is worse: it goes green
      # either way and the only symptom is data that silently stops updating.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}

      # Stamp the asset cache-busting query string from the commit being
      # deployed, so it can never be forgotten. index.html carries a hand-bumped
      # `?v=NNN` on app.js and styles.css; between 6830408 and 2026-08-13 app.js
      # changed three times (a 937-line revert and a feature) while the counter
      # stayed at 106, so returning visitors could pair fresh HTML with a cached
      # app.js. GitHub Pages serves these with max-age and no header control, and
      # the counter is exactly the kind of manual step that gets missed in review.
      #
      # This rewrites only the deployment artifact, never the repo: the committed
      # counter stays as the human-readable marker, and the deployed bytes get a
      # value that changes on its own with every commit. Data files under
      # public/data/ are unaffected — they carry ?v=<release> from version.json.
      - name: Stamp asset cache-busting from the deployed commit
        env:
          DEPLOY_SHA: ${{ inputs.sha || github.sha }}
        run: |
          V="${DEPLOY_SHA:0:7}"
          # Two plain BRE substitutions rather than one alternation — `\|` is a
          # GNU extension that no-ops silently under BSD sed, which would leave
          # the stale counter in place and look like it worked.
          sed -i -e "s/app\.js?v=[0-9A-Za-z]*/app.js?v=$V/" \
                 -e "s/styles\.css?v=[0-9A-Za-z]*/styles.css?v=$V/" public/index.html
          grep -oE '(app\.js|styles\.css)\?v=[^"]*' public/index.html
          # Fail loudly rather than deploy an unstamped page.
          grep -q "app.js?v=$V" public/index.html || { echo "::error::stamp failed"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
