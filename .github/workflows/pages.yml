name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to deploy (default: head of the dispatched ref)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Deploy an EXPLICIT commit when one is given, not whatever `main` resolves
      # to now. refresh.yml pushes and then immediately dispatches this workflow,
      # and GitHub's resolution of `--ref main` is not guaranteed to have caught
      # up with that push. Observed in the sibling CalCOFI/ctd-transects, which
      # runs this same pair: a refresh pushed 2dccd93 and the pages run it
      # dispatched 81s later checked out that job's own PRE-push SHA, uploaded
      # the stale tree, and reported success. The site got a fresh Last-Modified
      # wrapping old bytes and nothing went red.
      #
      # It is a race, not a deterministic failure, which is worse: it goes green
      # either way and the only symptom is data that silently stops updating.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public
      - id: deployment
        uses: actions/deploy-pages@v4
