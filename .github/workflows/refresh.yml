name: Refresh coverage data

# Rebuilds the prebuilt coverage JSON (public/data/{stations,variables}.json +
# metadata/crosswalk_variables.csv) from the latest CalCOFI integrated-DB ingest
# parquet on public GCS, then commits any change, which the Deploy to GitHub Pages
# workflow picks up. Triggered on every DB release via `gh workflow run` from
# CalCOFI/workflows (release promotion), plus a weekly fallback + manual run.
#
# The commit below must NOT carry [skip ci]. pages.yml is the only push-triggered
# workflow in this repo and deploying is precisely what should happen when the
# data changes — [skip ci] suppressed it, so for months a refresh commit updated
# the repo and never the site, and new data reached production only when somebody
# happened to push code for an unrelated reason. Verified 2026-08-04: the four
# most recent refresh commits had zero associated Pages deploys.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — freshness fallback
  repository_dispatch:
    types: [db-release]

permissions:
  contents: write

concurrency:
  group: refresh-coverage
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install DuckDB CLI
        run: |
          curl -fsSL https://install.duckdb.org | sh
          echo "$HOME/.duckdb/cli/latest" >> "$GITHUB_PATH"

      - name: Rebuild coverage data from integrated DB
        run: |
          REL=$(curl -s https://storage.googleapis.com/calcofi-db/ducklake/releases/latest.txt | tr -d '[:space:]')
          echo "resolved release: $REL"
          duckdb -c ".read scripts/build_crosswalk.sql"
          # build_stations.sql writes BOTH stations.json and taxon_coverage.json
          sed "s/__RELEASE__/$REL/g" scripts/build_stations.sql | duckdb
          sed "s/__RELEASE__/$REL/g" scripts/build_vars.sql | duckdb
          sed "s/__RELEASE__/$REL/g" scripts/build_decades.sql | duckdb
          # build_depth_profiles.sql resolves the release itself (from latest.txt)
          # rather than via __RELEASE__ — see the note in its header — so it needs
          # no sed. It emits an uncompressed ~76 MB depth_profiles.json; the app
          # loads only the gzipped copy (fetchGzJson), so compress and drop the
          # raw file rather than committing it.
          duckdb -c ".read scripts/build_depth_profiles.sql"
          gzip -9 -f public/data/depth_profiles.json
          # Stamp the release these files were built from. app.js reads this and
          # appends ?v=<release> to every data fetch, because GitHub Pages serves
          # public/data/ with max-age=600 and no way to set headers — without it a
          # returning visitor pairs a fresh (cache-busted) app.js with a
          # stations.json from before a dataset was renamed. Writing it here means
          # the query string changes whenever the release does, with no counter for
          # anyone to remember to bump.
          printf '{"release":"%s","built":"%s"}\n' \
            "$REL" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/data/version.json
          ls -la public/data/

      - name: Commit if changed
        run: |
          git config user.name  "calcofi-bot"
          git config user.email "bot@calcofi.io"
          # Every generated artifact must be listed here. Anything the build
          # scripts write but this line omits is regenerated into the runner and
          # silently discarded, leaving the committed copy to drift from the rest
          # (taxon_coverage.json did exactly that when it was first added).
          git add public/data/stations.json public/data/variables.json public/data/decades.json \
                  public/data/taxon_coverage.json public/data/depth_profiles.json.gz \
                  public/data/version.json \
                  metadata/crosswalk_variables.csv
          if git diff --cached --quiet; then
            echo "no coverage changes"
          else
            git commit -m "data: refresh station coverage from latest DB release"
            git push
          fi
